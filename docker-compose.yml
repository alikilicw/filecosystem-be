name: filecosystem

# Infrastructure starts by default. The Go services live behind the "apps"
# profile so day-to-day development can run them from source:
#   docker compose up -d                 # mongodb, rabbitmq
#   docker compose --profile apps up -d  # everything, built from source
#
# Object storage is Amazon S3. Put credentials in .env (see .env.example).
services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: filecosystem
      MONGO_INITDB_ROOT_PASSWORD: filecosystem
      MONGO_INITDB_DATABASE: filecosystem
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "filecosystem", "-p", "filecosystem", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: filecosystem
      RABBITMQ_DEFAULT_PASS: filecosystem
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    profiles: ["apps"]
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      ALLOWED_ORIGINS: "http://localhost:3000"
      MONGO_URI: "mongodb://filecosystem:filecosystem@mongodb:27017/filecosystem?authSource=admin"
      MONGO_DATABASE: filecosystem
      RABBITMQ_URL: "amqp://filecosystem:filecosystem@rabbitmq:5672/"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-1h}
    ports:
      - "8080:8080"

  worker:
    profiles: ["apps"]
    build:
      context: ../filecosystem-workers
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: development
      WORKER_CONCURRENCY: "4"
      RABBITMQ_URL: "amqp://filecosystem:filecosystem@rabbitmq:5672/"
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-1h}
    ports:
      - "8090:8090"

volumes:
  mongodb-data:
  rabbitmq-data:
